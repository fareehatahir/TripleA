# Nginx in front of the app on a VPS. Copy to /etc/nginx/sites-available/tripleaint.tw, symlink into sites-enabled,
# then:  sudo certbot --nginx -d tripleaint.tw -d www.tripleaint.tw
server {
    listen 80;
    server_name tripleaint.tw www.tripleaint.tw;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://tripleaint.tw$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.tripleaint.tw;
    ssl_certificate     /etc/letsencrypt/live/tripleaint.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripleaint.tw/privkey.pem;
    return 301 https://tripleaint.tw$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tripleaint.tw;
    ssl_certificate     /etc/letsencrypt/live/tripleaint.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripleaint.tw/privkey.pem;

    # Product photo ZIPs can be large (the app allows up to 200 MB)
    client_max_body_size 220m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # IMPORTANT: overwrite (never append) so visitors cannot forge their IP and dodge the login/inquiry rate limits.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
